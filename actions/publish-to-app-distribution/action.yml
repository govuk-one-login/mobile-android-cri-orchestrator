name: 'Distribute app'
description: 'Uploads the supplied aabs to the Firebase App Distribution'
inputs:
  aab-paths:
    description: 'App bundle paths to upload, JSON object'
    required: true
  app_ids:
    description: 'App IDs, array'
    required: true
  google-service-account-json:
    description: 'The path to the Google service account JSON credentials file used to authenticate with Google'
    required: true
  working-directory:
    description: 'The working directory for steps in this action'
    required: false
    default: '.'

runs:
  using: "composite"
  steps:
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically

    - name: Update fastlane and publish to build env firebase app distribution
      run: |
        BUNDLES=($(echo $INPUT_AAB_PATHS | tr ";" "\n"))
        
        BUNDLE=${BUNDLES[1]}
        echo "Bundle = $BUNDLE" 
        IFS=: VER=(${BUNDLE})
        
        FLAVOR=${VER[0]}
        AAB_PATH="$(pwd)/${VER[1]}"
        echo "Flavor = $FLAVOR"
        echo "AAB path for fastlane = $AAB_PATH"
        echo "current directory location: $(pwd)"
                
        export SUPPLY_UPLOAD_MAX_RETRIES=5
        bundle exec fastlane android distribute \
          app_id:"$INPUT_APP_IDS" \
          json_key:"${INPUT_JSON_KEY_PATH}" \
          aab_path:${AAB_PATH}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_AAB_PATHS: ${{ inputs.aab-paths }}
        INPUT_APP_IDS: ${{ inputs.app_ids }}
        INPUT_JSON_KEY_PATH: ${{ inputs.google-service-account-json }}
        LC_ALL: en_US.utf8
        LANG: en_US.utf8
        GEM_HOME: $HOME/.gem
        GEM_PATH: $HOME/.gem