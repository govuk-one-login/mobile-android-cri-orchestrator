name: Test

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - main
      - temp/hotfix
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-tests:
    name: Component tests
    runs-on: ubuntu-latest
    permissions:
      # Set permissions for ${{ secrets.GITHUB_TOKEN }}
      # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
      contents: read
      packages: read
    steps:
      - name: Run checkout github action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Set up GitHub runner
        uses: ./actions/setup-runner

      - name: Component test
        id: component-tests
        # Exclude Konsist unit tests which are actually lint checks
        # Build all unit tests so that jars are available for Sonar
        # Provide a version number so that Sonar can find jars that include the version in the name
        uses: ./actions/gradle-checks
        with:
          test-type: "component"
          github-token: ${{ secrets.MODULE_FETCH_TOKEN }}
          github-actor: ${{ secrets.MODULE_FETCH_TOKEN_USERNAME }}
          version-name: ${{ github.ref == 'refs/heads/main' && steps.versioning.outputs.new_version || '' }}

      - name: Upload test report
        if: ${{ failure() && steps.unit-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: component-test-reports
          path: "**/build/reports/tests/**/*"

      - name: Upload component test coverage report
        uses: ./mobile-android-pipelines/actions/upload-coverage-reports
        with:
          artifact-name: component-reports
          path: "**/build/reports/jacoco/**/*.xml"

      - name: Clean workspace
        if: ${{ always() }}
        uses: ./mobile-android-pipelines/actions/clean-workspace

  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    permissions:
      # Set permissions for ${{ secrets.GITHUB_TOKEN }}
      # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
      contents: read
      packages: read
    steps:
      - name: Run checkout github action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Set up GitHub runner
        uses: ./actions/setup-runner

      - name: Contract test
        id: contract-tests
        # Exclude Konsist unit tests which are actually lint checks
        # Build all unit tests so that jars are available for Sonar
        # Provide a version number so that Sonar can find jars that include the version in the name
        uses: ./actions/gradle-checks
        with:
          test-type: "contract"
          github-token: ${{ secrets.MODULE_FETCH_TOKEN }}
          github-actor: ${{ secrets.MODULE_FETCH_TOKEN_USERNAME }}
          version-name: ${{ github.ref == 'refs/heads/main' && steps.versioning.outputs.new_version || '' }}

      - name: Upload test report
        if: ${{ failure() && steps.unit-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-test-reports
          path: "**/build/reports/tests/**/*"

      - name: Upload contract test coverage report
        uses: ./mobile-android-pipelines/actions/upload-coverage-reports
        with:
          artifact-name: contract-reports
          path: "**/build/reports/jacoco/**/*.xml"

      - name: Clean workspace
        if: ${{ always() }}
        uses: ./mobile-android-pipelines/actions/clean-workspace

  unit-test:
    name: Unit test
    runs-on: ubuntu-latest
    permissions:
      # Set permissions for ${{ secrets.GITHUB_TOKEN }}
      # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
      packages: read
      pull-requests: write
    env:
      GITHUB_ACTOR: ${{ secrets.MODULE_FETCH_TOKEN_USERNAME}}
      GITHUB_TOKEN: ${{ secrets.MODULE_FETCH_TOKEN }}
    steps:
      - name: Run checkout github action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Set up GitHub runner
        uses: ./actions/setup-runner

      - name: Cache mobile-android-pipelines build
        uses: ./actions/cache-pipelines-build

      - name: Get version
        id: versioning
        uses: ./mobile-android-pipelines/actions/increment-version
        with:
          dry-run: true

      - name: Unit test
        id: unit-tests
        # Exclude Konsist unit tests which are actually lint checks
        # Build all unit tests so that jars are available for Sonar
        # Provide a version number so that Sonar can find jars that include the version in the name
        uses: ./actions/gradle-checks
        with:
          test-type: "unit"
          github-token: ${{ secrets.MODULE_FETCH_TOKEN }}
          github-actor: ${{ secrets.MODULE_FETCH_TOKEN_USERNAME }}
          version-name: ${{ github.ref == 'refs/heads/main' && steps.versioning.outputs.new_version || '' }}

      - name: Upload test report
        if: ${{ failure() && steps.unit-tests.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**/*"

      # Sonar analyzers must have access to the bytecode to perform an accurate analysis.
      # https://community.sonarsource.com/t/sonarscanner-for-gradle-you-can-now-decide-when-to-compile/102069
      - name: Upload jars
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jars
          path: "**/build/**/*.jar"

      - name: Upload unit test coverage report
        uses: ./mobile-android-pipelines/actions/upload-coverage-reports
        with:
          artifact-name: unit-reports
          path: "**/build/reports/jacoco/**/*.xml"

      - name: Publish analytics test report
        uses: ./actions/publish-analytics-report
        with:
          path: "build/reports/analytics/*.yml"

      - name: Clean workspace
        if: ${{ always() }}
        uses: ./mobile-android-pipelines/actions/clean-workspace

  snapshot-tests:
    name: Snapshot tests
    runs-on: ubuntu-latest
    permissions:
      # Set permissions for ${{ secrets.GITHUB_TOKEN }}
      # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
      contents: read
      packages: read
    steps:
      - name: Run checkout github action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Set up GitHub runner
        uses: ./actions/setup-runner

      - name: Snapshot test
        id: snapshot-tests
        # Exclude Konsist unit tests which are actually lint checks
        # Build all unit tests so that jars are available for Sonar
        # Provide a version number so that Sonar can find jars that include the version in the name
        uses: ./actions/gradle-checks
        with:
          test-type: "snapshot"
          github-token: ${{ secrets.MODULE_FETCH_TOKEN }}
          github-actor: ${{ secrets.MODULE_FETCH_TOKEN_USERNAME }}
          version-name: ${{ github.ref == 'refs/heads/main' && steps.versioning.outputs.new_version || '' }}

      - name: Clean workspace
        if: ${{ always() }}
        uses: ./mobile-android-pipelines/actions/clean-workspace

  # Not all the projects are running instrumentation tests. This job is here to check they still compile.
  assemble-instrumentation-tests:
    name: Assemble instrumentation tests
    runs-on: ubuntu-latest
    permissions:
      # Set permissions for ${{ secrets.GITHUB_TOKEN }}
      # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
      packages: read
    steps:
      - name: Run checkout github action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Set up GitHub runner
        uses: ./actions/setup-runner

      - name: Cache mobile-android-pipelines build
        uses: ./actions/cache-pipelines-build

      - name: Assemble instrumentation tests
        run: ./gradlew assembleDebugAndroidTest
        env:
          GITHUB_ACTOR: ${{ secrets.MODULE_FETCH_TOKEN_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.MODULE_FETCH_TOKEN }}

      - name: Clean workspace
        if: ${{ always() }}
        uses: ./mobile-android-pipelines/actions/clean-workspace

  test-wrapper-instrumentation-test:
    name: Run test wrapper instrumentation tests
    runs-on: ubuntu-latest
    permissions:
      # Set permissions for ${{ secrets.GITHUB_TOKEN }}
      # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
      packages: read
    steps:
      - name: Run checkout github action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Set up GitHub runner
        uses: ./actions/setup-runner

      - name: Cache mobile-android-pipelines build
        uses: ./actions/cache-pipelines-build

      - name: Run test wrapper instrumentation tests
        # If you need to run tests from different sub-projects, run these in
        # parallel, in separate jobs.
        run: ./gradlew :test-wrapper:allDevicesBuildDebugAndroidTest
        env:
          GITHUB_ACTOR: ${{ secrets.MODULE_FETCH_TOKEN_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.MODULE_FETCH_TOKEN }}

      - name: Upload test coverage report
        uses: ./mobile-android-pipelines/actions/upload-coverage-reports
        with:
          artifact-name: test-wrapper-instrumentation-test-coverage

      - name: Clean workspace
        if: ${{ always() }}
        uses: ./mobile-android-pipelines/actions/clean-workspace

  sonar-scan:
    name: Scan with Sonar
    runs-on: ubuntu-latest
    needs:
      - unit-test
      - test-wrapper-instrumentation-test
    steps:
      - name: Run checkout github action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          lfs: 'true'
          submodules: 'true'
          fetch-depth: 0

      - name: Set up GitHub runner
        uses: ./actions/setup-runner

      - name: Cache mobile-android-pipelines build
        uses: ./actions/cache-pipelines-build

      - name: Download jars
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: jars

      - name: Download unit test coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: unit-test-coverage

      - name: Download test wrapper instrumentation test coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: test-wrapper-instrumentation-test-coverage

      - name: Get version
        id: versioning
        uses: ./mobile-android-pipelines/actions/increment-version
        with:
          dry-run: true

      - name: Scan with Sonar
        uses: ./mobile-android-pipelines/actions/sonar-scan
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          version-name: ${{ github.ref == 'refs/heads/main' && steps.versioning.outputs.new_version || '' }}
        env:
          GITHUB_ACTOR: ${{ secrets.MODULE_FETCH_TOKEN_USERNAME}}
          GITHUB_TOKEN: ${{ secrets.MODULE_FETCH_TOKEN }}

      - name: Clean workspace
        if: ${{ always() }}
        uses: ./mobile-android-pipelines/actions/clean-workspace
